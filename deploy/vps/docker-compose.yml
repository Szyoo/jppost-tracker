# vultr-jp 部署编排（配合 docs/vultr-vps-deploy.md 使用）
#
# 关键安全约定：两个服务都【不 publish 端口】。这台机器上 Docker 的
# iptables 规则会绕过 ufw，任何 publish 到 0.0.0.0 的端口都会直接暴露
# 在公网——所以对外一律经 Caddy（同在 ingress 网络里）反代。
services:
  jppost-tracker:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: jppost-tracker
    restart: unless-stopped
    env_file:
      # format: raw 禁用 compose 变量插值 —— werkzeug 密码哈希里带 $，
      # 否则会被当成变量替换成空串（portal.env 同款处理）
      - path: ./.env
        format: raw
    # 不再用 environment: ${VAR:-默认} 插值：那会让 compose 把同目录 .env 当插值源解析，
    # 密码哈希里的 $ 触发 "variable is not set" 警告。SZYYW_SSO / SZYYW_SSO_AUTOCREATE /
    # PORTAL_ORIGIN 直接写在 .env 里经上面的 raw env_file 进容器，未设置时代码默认
    # 分别为 0 / 0 / https://szyyw.xyz。注意 SZYYW_SSO=1 只能在 Caddy 已对
    # jppost.szyyw.xyz 启用 (sso) 门卫之后才设，否则任何人都能伪造 X-User / X-Portal-Sub 头。
    volumes:
      # SQLite 账号库与运行日志持久化在宿主机
      - ./data:/app/data
      - ./logs:/app/logs
      # .env 挂进容器，供网页"在线编辑环境变量"功能读写
      - ./.env:/app/.env
    networks:
      - ingress

  bark:
    # Bark Server 用官方镜像独立跑，不再由 Flask 拉子进程；
    # 网页控制台里"启动/停止 Bark 服务"按钮在该部署形态下不使用。
    image: finab/bark-server
    container_name: jppost-bark
    restart: unless-stopped
    volumes:
      - ./bark-data:/data
    networks:
      - ingress

networks:
  ingress:
    external: true
    # 实机上该网络由 /opt/ingress 的 compose 项目创建，实际名称带项目前缀
    name: ingress_ingress
