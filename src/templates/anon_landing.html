<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula"{% if sso_on %} data-sso="1" data-portal="{{ portal_origin }}"{% endif %}>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JP Post Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    {% include '_appearance_head.html' %}
    <link rel="stylesheet" href="/static/vendor/szyyw-design/tokens.css" />
    <link rel="stylesheet" href="/static/vendor/szyyw-design/components.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <!-- portal SSO 匿名访客（X-Portal-Anon: 1）：只有公开介绍，不含任何任务/设置/管理入口。
         右上角账户菜单（boot.js 挂载）显示「登录」。 -->
    <div class="page">
      <header class="app-header page-header rise">
        <div class="app-brand">
          <span class="app-sub">JP Post Tracker</span>
          <h1 class="app-title">日本邮政快递追踪</h1>
        </div>
      </header>

      <div class="section">
        <div class="panel glass rise">
          <div class="empty">
            <div class="empty-icon" aria-hidden="true">📦</div>
            <p>填入日本邮政单号，后台定时查询官网物流记录，状态一有变化就通过 Bark 推送到你的 iPhone。</p>
            <p>登录后即可管理自己的追踪任务与 Bark 设备。</p>
            <form method="get" action="/login" class="section">
              <button type="submit" class="btn">登录</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/boot.js"></script>
  </body>
</html>
