<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · JP Post Tracker</title>
    <script>
      try { document.documentElement.dataset.scheme = localStorage.getItem('jppost_scheme') || 'auto'; } catch (e) { document.documentElement.dataset.scheme = 'auto'; }
    </script>
    <link rel="stylesheet" href="/static/vendor/szyyw-design/tokens.css" />
    <link rel="stylesheet" href="/static/vendor/szyyw-design/components.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <div class="auth-shell">
      <div class="auth-card glass rise{% if error %} shake{% endif %}">
        <div class="auth-eyebrow">JP Post Tracker</div>
        <h1 class="auth-title">登录</h1>
        <p class="auth-subtitle">输入用户名和密码后，系统会按你的角色进入管理员后台或个人门户。</p>

        {% if error %}
        <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
          <input type="hidden" name="next" value="{{ next_target }}" />

          <label for="username">用户名</label>
          <input id="username" name="username" type="text" class="field" autocomplete="username" placeholder="输入用户名" required />

          <label for="password">密码</label>
          <input id="password" name="password" type="password" class="field" autocomplete="current-password" placeholder="输入密码" required />

          <button type="submit" class="btn">进入</button>
        </form>

        <div class="auth-link-row">
          <span>还没有普通用户账号？</span>
          <a href="{{ url_for('register', next=next_target) }}">去注册</a>
        </div>

        <div class="auth-help">
          当前管理员引导用户名：<code>{{ admin_username }}</code>
        </div>
      </div>
    </div>

    <script type="module" src="/static/boot.js"></script>
  </body>
</html>
