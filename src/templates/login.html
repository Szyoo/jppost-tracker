<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · JP Post Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    {% include '_appearance_head.html' %}
    {% include '_design_head.html' %}
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <div class="app-frame">
      <main class="app-main auth-shell">
        <div class="glass auth-card rise{% if error %} shake{% endif %}">
          <p class="app-sub">JP Post Tracker</p>
          <h1 class="app-title">登录</h1>
          <p class="auth-sub">输入用户名和密码后，系统会按你的角色进入管理员后台或个人门户。</p>

          <form method="post" class="stack">
            {%- if error %}
            <p class="callout err" role="alert">{{ error }}</p>
            {%- endif %}
            <input type="hidden" name="next" value="{{ next_target }}" />

            <div class="form-row">
              <label for="username">用户名</label>
              <input id="username" name="username" type="text" class="field" autocomplete="username" placeholder="输入用户名" required />
            </div>

            <div class="form-row">
              <label for="password">密码</label>
              <input id="password" name="password" type="password" class="field" autocomplete="current-password" placeholder="输入密码" required />
            </div>

            <button type="submit" class="btn">进入</button>
          </form>

          <p class="auth-foot">还没有普通用户账号？<a class="link" href="{{ url_for('register', next=next_target) }}">去注册</a></p>
          <p class="auth-foot">当前管理员引导用户名：<code>{{ admin_username }}</code></p>
        </div>
      </main>
    </div>

    <script type="module" src="/static/boot.js"></script>
  </body>
</html>
