<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 · JP Post Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    {% include '_appearance_head.html' %}
    {% include '_design_head.html' %}
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <div class="app-frame">
      <main class="app-main auth-shell">
        <div class="glass auth-card rise{% if error %} shake{% endif %}">
          <p class="app-sub">Create Account</p>
          <h1 class="app-title">注册普通用户</h1>
          <p class="auth-sub">注册后只会看到自己的快递与 Bark 设置页，不会看到管理员的系统控制功能。</p>

          <form method="post" action="/register" class="stack">
            {%- if error %}
            <p class="callout err" role="alert">{{ error }}</p>
            {%- endif %}
            <input type="hidden" name="next" value="{{ next_target }}" />

            <div class="form-row">
              <label for="register_display_name">显示名称</label>
              <input
                id="register_display_name"
                name="register_display_name"
                type="text"
                class="field"
                autocomplete="name"
                placeholder="例如 张三 / 家人共用账号"
                required
              />
            </div>

            <div class="form-row">
              <label for="register_username">用户名</label>
              <input
                id="register_username"
                name="register_username"
                type="text"
                class="field"
                autocomplete="username"
                placeholder="仅支持小写字母、数字、点、下划线、短横线"
                required
              />
            </div>

            <div class="form-row">
              <label for="register_password">密码</label>
              <input
                id="register_password"
                name="register_password"
                type="password"
                class="field"
                autocomplete="new-password"
                placeholder="设置登录密码"
                required
              />
            </div>

            <button type="submit" class="btn">注册并登录</button>
          </form>

          <p class="auth-foot">已经有账号了？<a class="link" href="{{ url_for('login', next=next_target) }}">返回登录</a></p>
        </div>
      </main>
    </div>

    <script type="module" src="/static/boot.js"></script>
  </body>
</html>
