<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 · JP Post Tracker</title>
    <script>
      try { document.documentElement.dataset.scheme = localStorage.getItem('jppost_scheme') || 'auto'; } catch (e) { document.documentElement.dataset.scheme = 'auto'; }
    </script>
    <link rel="stylesheet" href="/static/vendor/szyyw-design/tokens.css" />
    <link rel="stylesheet" href="/static/vendor/szyyw-design/components.css" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-layer"></div>

    <div class="auth-shell">
      <div class="auth-card glass rise{% if error %} shake{% endif %}">
        <div class="auth-eyebrow">Create Account</div>
        <h1 class="auth-title">注册普通用户</h1>
        <p class="auth-subtitle">注册后只会看到自己的快递与 Bark 设置页，不会看到管理员的系统控制功能。</p>

        {% if error %}
        <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register" class="auth-form">
          <input type="hidden" name="next" value="{{ next_target }}" />

          <label for="register_display_name">显示名称</label>
          <input
            id="register_display_name"
            name="register_display_name"
            type="text"
            class="field"
            autocomplete="name"
            placeholder="例如 张三 / 家人共用账号"
            required
          />

          <label for="register_username">用户名</label>
          <input
            id="register_username"
            name="register_username"
            type="text"
            class="field"
            autocomplete="username"
            placeholder="仅支持小写字母、数字、点、下划线、短横线"
            required
          />

          <label for="register_password">密码</label>
          <input
            id="register_password"
            name="register_password"
            type="password"
            class="field"
            autocomplete="new-password"
            placeholder="设置登录密码"
            required
          />

          <button type="submit" class="btn">注册并登录</button>
        </form>

        <div class="auth-link-row">
          <span>已经有账号了？</span>
          <a href="{{ url_for('login', next=next_target) }}">返回登录</a>
        </div>
      </div>
    </div>

    <script type="module" src="/static/boot.js"></script>
  </body>
</html>
